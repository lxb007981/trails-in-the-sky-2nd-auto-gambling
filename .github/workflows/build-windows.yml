name: Build Windows EXE

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: x64
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Run offline tests
        run: python -m unittest -v
      - name: Build standalone EXE
        # Keep console streams for worker logs; hide the console on desktop launch.
        run: >-
          python -m PyInstaller --noconfirm --clean --onefile --console
          --hide-console hide-early --name Sora2AutoGambling
          --paths . --collect-submodules casino --add-data "assets:assets"
          --icon assets/sora_2.ico packaging/launcher.py
      - name: Check bundled GUI and workers
        run: |
          $process = Start-Process -FilePath dist/Sora2AutoGambling.exe -ArgumentList '--smoke-test' -WindowStyle Hidden -PassThru -RedirectStandardOutput build/smoke.stdout.log -RedirectStandardError build/smoke.stderr.log
          if (-not $process.WaitForExit(180000)) {
            Stop-Process -Id $process.Id -Force
            throw 'Packaged smoke test timed out'
          }
          Get-Content build/smoke.stdout.log, build/smoke.stderr.log
          if ($process.ExitCode -ne 0) { throw "Packaged smoke test failed: $($process.ExitCode)" }
      - uses: actions/upload-artifact@v4
        with:
          name: Sora2AutoGambling-windows-x64
          path: dist/Sora2AutoGambling.exe
          if-no-files-found: error
          retention-days: 30
